<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Yasvanth Udayakumar technical profile banner</title>
  <desc id="desc">A dark technical signal map connecting AI agents, cloud applications, mobile systems, observability, architecture, and reliability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.45" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.25" stop-color="#38bdf8"/>
      <stop offset="0.65" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#111827"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <path d="M125 315 C260 160 380 295 515 170 S760 75 905 210 S1035 300 1110 105" fill="none" stroke="url(#line)" stroke-width="3"/>
  <path d="M160 125 C315 255 430 90 600 214 S860 360 1028 162" fill="none" stroke="#38bdf8" stroke-opacity="0.24" stroke-width="2"/>
  <path d="M220 340 C380 225 480 340 610 235 S830 100 1035 296" fill="none" stroke="#22c55e" stroke-opacity="0.22" stroke-width="2"/>

  <g filter="url(#glow)">
    <circle cx="600" cy="210" r="68" fill="url(#core)" opacity="0.92"/>
    <circle cx="600" cy="210" r="96" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="600" cy="210" r="128" fill="none" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <g fill="#e5e7eb" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="600" y="194" font-size="22" text-anchor="middle" font-weight="700">Cloud + AI</text>
    <text x="600" y="224" font-size="17" text-anchor="middle" fill="#dbeafe">Architecture Layer</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    <g>
      <circle cx="205" cy="116" r="12" fill="#38bdf8"/>
      <rect x="225" y="92" width="150" height="48" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="300" y="121" text-anchor="middle" fill="#e0f2fe">AI Agents</text>
    </g>
    <g>
      <circle cx="395" cy="296" r="12" fill="#a78bfa"/>
      <rect x="220" y="272" width="150" height="48" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="295" y="301" text-anchor="middle" fill="#f3e8ff">LLM Ops</text>
    </g>
    <g>
      <circle cx="795" cy="118" r="12" fill="#22c55e"/>
      <rect x="815" y="94" width="165" height="48" rx="14" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.55"/>
      <text x="897" y="123" text-anchor="middle" fill="#dcfce7">Mobile Apps</text>
    </g>
    <g>
      <circle cx="956" cy="285" r="12" fill="#f59e0b"/>
      <rect x="780" y="262" width="156" height="48" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="858" y="291" text-anchor="middle" fill="#fef3c7">Cloud Arch</text>
    </g>
    <g>
      <circle cx="1032" cy="168" r="12" fill="#f43f5e"/>
      <rect x="998" y="190" width="142" height="48" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.55"/>
      <text x="1069" y="219" text-anchor="middle" fill="#ffe4e6">Cloud SRE</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="70" y="66" fill="#ffffff" font-size="38" font-weight="800">Yasvanth Udayakumar</text>
    <text x="70" y="103" fill="#bfdbfe" font-size="19">cloud applications | mobile systems | AI automation | observability | cloud reliability</text>
    <text x="70" y="368" fill="#cbd5e1" font-size="16">Staff Software Engineer | 14+ years | Distributed systems | Azure + AWS | OpenTelemetry</text>
  </g>

  <g opacity="0.75">
    <circle cx="1090" cy="70" r="3" fill="#e0f2fe"/>
    <circle cx="1122" cy="92" r="2" fill="#a78bfa"/>
    <circle cx="1058" cy="118" r="2.5" fill="#38bdf8"/>
    <circle cx="1000" cy="62" r="2" fill="#22c55e"/>
    <circle cx="145" cy="240" r="2.5" fill="#38bdf8"/>
    <circle cx="175" cy="272" r="2" fill="#a78bfa"/>
    <circle cx="94" cy="296" r="3" fill="#22c55e"/>
  </g>
</svg>
